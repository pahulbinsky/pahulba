[QuickLaunchButtons]
BUT_X = hdd:\Apps\Aurora\Aurora.xex //при долгом нажатии кнокпи Х открывается программа или папка сюда нужно вписать ссылку до
Default = hdd:\Apps\Aurora\Aurora.xex //автозапуск прошитой консоли,  в данном случае Aurora
[Settings]
nxemini = true //отключает высплывающее дефолтное меню xbox
pingpatch = true // снимает ограничение пинга до 30мс
contpatch = true // автоматически активирует скачанный контент
fatalfreeze = true // консоль зависает в случае критической ошибки, а не перезагружается, позволяет отследить лог
regionspoof = true // подменяет регион и отключает региональные ограничения
dvdexitdash = true // если игра запущена с диска и вы выходите из игры то автоматически вернет в меню прошивки, а не в дефолтное меню консоли, как при запуске
xblaexitdash = true // тоже самое что и сверху 
liveblock = true // блокирует связь с официальным сервером xbox live
livestrong = false // блокирует Ip майкрософт, выключено тк нужно для загрузки обложек игр
noupdater = true // блокирует системные апдейты системы чтобы не слетела прошивка
nosysexit = true // блокирует случайный вход в родное меню xbox
exchandler = false // отключает запись логов ошибок
debugout = false // включает вывод технической информации консоли
remotenxe = true // позволяет с помощью кнокпи guide зажатой для включения на ГП открыть официальное меню xbox
nohud = false // отключает работу мини-меню на кнопке guide
signnotice = true // убирает сообщения о входе в профиль (раздражает)
autoswap = true // включает автоматическую смену дисков, если программа многодисковая
fakelive = false // эмуляци подключения к сети, некоторые игры без этого не запускаются


